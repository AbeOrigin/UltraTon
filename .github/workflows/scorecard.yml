# OpenSSF Scorecard: supply-chain checks (pinned actions, token permissions, branch protection, signed releases, ...).
# Results go to the Security tab (SARIF) and to the public Scorecard API, which serves the README badge.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish the results to the OpenSSF API (the badge)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true

    - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: results.sarif
