name: UltraTon CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the minimum in package.json engines; it strips types only behind a flag.
        node-version: [22.12.0, 22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build && npm run build:strict

    - name: TSDoc on every public symbol
      run: npm run check:tsdoc

    - name: Public API unchanged
      run: npm run check:api

    - name: Run Test Suite
      run: npm test
      env:
        NODE_OPTIONS: ${{ matrix.node-version == '22.12.0' && '--experimental-strip-types' || '' }}

    - name: Package smoke test (import, require, tsc)
      run: npm run test:package

    - name: Package lint (publint, attw)
      run: npm run lint:package

  compat:
    # The packed tarball with the real clients createSecureAgents is meant for (axios, got, node-fetch), pinned in
    # compat/package.json. Their dependencies never reach the root install or the published package.
    name: Compat (axios, got, node-fetch)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          compat/package-lock.json

    - name: Install root dependencies
      run: npm ci

    - name: Pack the package
      run: |
        rm -f compat/ultraton-*.tgz
        npm pack --pack-destination compat

    # No install scripts ever run for third-party code: none of the pinned packages needs one, and a malicious
    # future version that adds one gets nowhere.
    - name: Install compat dependencies and the tarball
      working-directory: compat
      run: |
        npm ci --ignore-scripts
        npm install --no-save --ignore-scripts ./ultraton-*.tgz

    - name: Run compat tests
      working-directory: compat
      run: npm test
