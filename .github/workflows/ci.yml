name: UltraTon CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the minimum in package.json engines; it strips types only behind a flag.
        node-version: [22.12.0, 22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build && npm run build:strict

    - name: Run Test Suite
      run: npm test
      env:
        NODE_OPTIONS: ${{ matrix.node-version == '22.12.0' && '--experimental-strip-types' || '' }}

    - name: Package smoke test (import, require, tsc)
      run: npm run test:package

    - name: Package lint (publint, attw)
      run: npm run lint:package
