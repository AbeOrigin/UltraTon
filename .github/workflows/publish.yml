name: Publish to npm

# Publishing uses npm trusted publishing (OIDC): no npm token is stored in the repository.
# One-time setup on npmjs.com: package settings → Trusted publisher → GitHub Actions,
# repository AbeOrigin/UltraTon, workflow file publish.yml, environment npm.
# Add required reviewers to the "npm" environment (repo Settings → Environments) so a release needs an approval.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x # bundles an npm recent enough for trusted publishing
        registry-url: 'https://registry.npmjs.org'

    - name: Tag matches package.json version
      run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

    - run: npm ci

    # prepack builds a clean dist; prepublishOnly runs the test suite and the package smoke test.
    # A GitHub prerelease goes to the "next" dist-tag, never to "latest".
    - run: npm publish --provenance --access public --tag "$([ "$PRERELEASE" = true ] && echo next || echo latest)"
      env:
        PRERELEASE: ${{ github.event.release.prerelease }}
