name: Publish to npm

# Staged publishing through npm trusted publishing (OIDC). No npm token is stored anywhere, and CI can only *stage* a
# release: nothing reaches npm until a maintainer approves it with 2FA (npmjs.com → Staged Packages, or
# `npm stage approve <stage-id>`).
# One-time setup on npmjs.com: package Settings → Trusted publisher → GitHub Actions, repository AbeOrigin/UltraTon,
# workflow file publish.yml, environment npm, with "Allow npm publish" and "Allow npm dist-tag" both unchecked
# (stage-only).
# Add required reviewers to the "npm" environment (repo Settings → Environments) so staging also needs an approval.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x # bundles npm >= 11.15, which `npm stage` needs
        registry-url: 'https://registry.npmjs.org'

    - name: Tag matches package.json version
      run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

    # No install scripts: the package has no runtime dependencies and the dev tools need none.
    - run: npm ci --ignore-scripts

    - run: npm test

    # Packs the tarball (prepack builds a clean dist) and checks import, require and tsc against it.
    - run: npm run test:package

    # The tarball contents were verified above, so no lifecycle script runs while staging.
    # A GitHub prerelease goes to the "next" dist-tag, never to "latest".
    - run: npm stage publish --ignore-scripts --provenance --access public --tag "$([ "$PRERELEASE" = true ] && echo next || echo latest)"
      env:
        PRERELEASE: ${{ github.event.release.prerelease }}
